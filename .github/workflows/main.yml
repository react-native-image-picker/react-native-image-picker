name: Main CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  Android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install example dependencies
        run: |
          yarn --cwd example install --frozen-lockfile

      - name: Test Android launch threading
        working-directory: example/android
        run: |
          ./gradlew :react-native-image-picker:testDebugUnitTest -PnewArchEnabled=false --no-daemon --stacktrace

  Main:
    needs: Android
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false
          
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          yarn install

      - name: Build
        run: |
          yarn prepare

      - name: Publish to NPM
        if: github.repository == 'react-native-image-picker/react-native-image-picker' && github.ref == 'refs/heads/main'
        run: |
          yarn ci:publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
